name: Build ZMK Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: zmkfirmware/zmk‑build‑action@main
        with:
          config: ${{ github.workspace }}/config/gamepad_12key
      - name: Upload Artifacts
        uses: actions/upload‑artifact@v4
        with:
          path: ./build/*.uf2
          name: gamepad‑12key‑firmware
